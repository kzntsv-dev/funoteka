name: CI

# Three things, and each one is a way the repository can lie about itself.
#
# `tests` — the suite runs on the version of Node the package asks for, from a
# clean checkout, with the lock file's versions rather than whatever `^` resolves
# to today. On a machine that has never run this project, which is the only
# machine that can tell you whether `npm ci` works.
#
# `publishable` — the values and the meta that must not be in a copy that leaves
# the private development tree. The gate checks the values **by value**, and the
# identifiers of this estate are not in this repository — this repository holds
# no secrets at all, on purpose. So CI runs the check that needs nothing private
# (shapes and meta) and says so in its verdict, while the full check runs at
# release time against the copy, where the identifiers legitimately live. See
# `deploy/check-publishable.mjs`.
#
# `image` — the Dockerfile is the first thing a stranger runs, and it is built on
# the machine that runs it (there is no cross-build and no published image yet).
# Building it here is the check; nothing is pushed from this workflow.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: tests (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  publishable:
    name: publishable (no private values, no meta)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # **This repository holds no secrets, and that is deliberate.** The sibling
      # public repository has none either, and it publishes to PyPI through OIDC
      # rather than a token; the identifiers of the private estate do not become
      # a repository secret just to be looked for. So the check here is the part
      # that needs nothing private — the shapes and the meta — and its verdict
      # says which check it is ("SHAPES ONLY"), instead of a green that would
      # read as a full one.
      #
      # The full check, with the estate's own identifiers, runs where they live:
      # at release time, from the development checkout, against the curated copy
      # before it is published (`FUNOTEKA_PRIVATE_VALUES` from a file outside
      # every repository). If this repository ever gains that secret, the step
      # below upgrades itself to the full check with no other change.
      - name: the gate
        run: |
          if [ -n "$FUNOTEKA_PRIVATE_VALUES" ]; then
            node deploy/check-publishable.mjs .
          else
            echo 'no FUNOTEKA_PRIVATE_VALUES here — checking the shapes and the meta, and saying so'
            node deploy/check-publishable.mjs . --shapes-only
          fi
        env:
          FUNOTEKA_PRIVATE_VALUES: ${{ secrets.FUNOTEKA_PRIVATE_VALUES }}

  image:
    name: image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t funoteka:ci .

  package:
    name: package builds, installs and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack
      # The two ways this artifact can be wrong, and neither one is visible from
      # its size. It can carry sources that cannot run — Node refuses to strip
      # types from anything under `node_modules`, which is why there is a build
      # at all — and it can carry the development tree, which is what a manifest
      # with no `files` field did: 119 meta files, found by packing it.
      - name: the tarball carries the build and not the meta
        run: |
          tar -tzf funoteka-*.tgz | grep -qx 'package/dist/cli.js'
          test "$(tar -tzf funoteka-*.tgz | grep -c '^package/dist/db/migrations/')" -ge 1
          if tar -tzf funoteka-*.tgz | grep -Eq 'package/(AGENTS\.md|CLAUDE\.md|\.mappa|\.pi/|\.wiki|\.tasks)|\.ts$'; then
            echo 'the package carries the development tree or unbuilt sources:'
            tar -tzf funoteka-*.tgz | grep -E 'AGENTS|CLAUDE|\.mappa|\.pi/|\.wiki|\.tasks|\.ts$'
            exit 1
          fi
      - name: what was packed is what installs and answers
        run: |
          mkdir -p /tmp/packed && cd /tmp/packed
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/funoteka-*.tgz
          ./node_modules/.bin/funoteka --help > /dev/null
