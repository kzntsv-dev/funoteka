name: CI

# Three things, and each one is a way the repository can lie about itself.
#
# `tests` — the suite runs on the version of Node the package asks for, from a
# clean checkout, with the lock file's versions rather than whatever `^` resolves
# to today. On a machine that has never run this project, which is the only
# machine that can tell you whether `npm ci` works.
#
# `publishable` — the values and the meta that must not be in a copy that leaves
# the private development tree. The gate checks the values **by value**, and the
# identifiers of this estate are not in this repository: they arrive from the
# repository secret `FUNOTEKA_PRIVATE_VALUES` (comma-separated). **The job fails
# on purpose when the secret is absent** — a green verdict from a gate that did
# not look for the hostname, the LAN and the handle is worse than a red check, so
# the gate exits 2 rather than pretending. See `deploy/check-publishable.mjs`.
#
# `image` — the Dockerfile is the first thing a stranger runs, and it is built on
# the machine that runs it (there is no cross-build and no published image yet).
# Building it here is the check; nothing is pushed from this workflow.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: tests (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  publishable:
    name: publishable (no private values, no meta)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: the gate
        run: node deploy/check-publishable.mjs .
        env:
          FUNOTEKA_PRIVATE_VALUES: ${{ secrets.FUNOTEKA_PRIVATE_VALUES }}

  image:
    name: image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t funoteka:ci .

  package:
    name: package builds, installs and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack
      # The two ways this artifact can be wrong, and neither one is visible from
      # its size. It can carry sources that cannot run — Node refuses to strip
      # types from anything under `node_modules`, which is why there is a build
      # at all — and it can carry the development tree, which is what a manifest
      # with no `files` field did: 119 meta files, found by packing it.
      - name: the tarball carries the build and not the meta
        run: |
          tar -tzf funoteka-*.tgz | grep -qx 'package/dist/cli.js'
          tar -tzf funoteka-*.tgz | grep -q '^package/dist/db/migrations/'
          if tar -tzf funoteka-*.tgz | grep -Eq 'package/(AGENTS\.md|CLAUDE\.md|\.mappa|\.pi/|\.wiki|\.tasks)|\.ts$'; then
            echo 'the package carries the development tree or unbuilt sources:'
            tar -tzf funoteka-*.tgz | grep -E 'AGENTS|CLAUDE|\.mappa|\.pi/|\.wiki|\.tasks|\.ts$'
            exit 1
          fi
      - name: what was packed is what installs and answers
        run: |
          mkdir -p /tmp/packed && cd /tmp/packed
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/funoteka-*.tgz
          ./node_modules/.bin/funoteka --help > /dev/null
